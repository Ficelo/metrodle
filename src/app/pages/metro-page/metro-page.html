<div class='game-container'>
    <h1 class='page-title'>METRODLE</h1>
    <!-- TODO : Redo the categories to look like the react one -->
    <metrodle-autocomplete
        [options]="autocompleteOptions()"
        [placeholder]="'Search for a metro'"
        (selected)="onMetroSelected($event)"
    />
    <metrodle-guess-metro />

    @for (guess of guesses; track guess.station.name) {
        <metrodle-guess-metro
          [guess]="guess"
        />
    }

</div>
