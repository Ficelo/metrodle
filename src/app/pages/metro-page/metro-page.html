<div class='game-container'>
    <h1 
        [class]="'page-title line-' + currentLine + '-color'"
    >METRODLE</h1>

    <metrodle-map />
    
    <metrodle-autocomplete
        [options]="autocompleteOptions()"
        [placeholder]="'Search for a metro station'"
        (selected)="onMetroSelected($event)"
    />

        @for (guess of guesses; track guess.station.name; let index = $index) {
        <metrodle-metro-panel
            [guess]="guess"
            [try]="guesses.length - index"
        />
    }
    
    
</div>
