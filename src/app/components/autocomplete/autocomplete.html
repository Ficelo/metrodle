<div class="autocomplete">
    <div class="input-wrapper">
        <input 
            #input
            type="text"
            role="combobox"
            autocomplete="off"
            [value]="query()"
            [placeholder]="placeholder()"
            [disabled]="disabled()"
            [attr.aria-expanded]="isOpen()"
            aria-haspopup="listbox"
            [attr.aria-controls]="isOpen() ? 'autocomplete-listbox' : null"
            [attr.aria-activedescendant]="
                activeIndex() >= 0 
                    ? optionId(activeIndex())
                    : null
            "
            (input)="onInput($event)"
            (focus)="onFocus()"
            (keydown)="onKeydown($event)"
        />

        @if (query()) {
            <button 
                type="button"
                class="clear-button"
                aria-label="Clear"
                (click)="clear()"
            > x </button >
        }

        @if (isOpen() && filteredOptions().length > 0) {
            <ul id="autocomplete-listbox" class="options" role="listbox">
                @for (option of filteredOptions(); track option.id; let i = $index) {
                    <li
                        [id]="optionId(i)"
                        class="option"
                        role="option"
                        [attr.aria-selected]="activeIndex() === i"
                        [class.active]="activeIndex() === i"
                        (mousedown)="$event.preventDefault()"
                        (click)="select(option)"
                    >
                        {{ option.label }}
                    </li>
                }
            </ul>
        }

        @if (isOpen() && filteredOptions().length === 0 && query().length > 0) {
            <div class="no-results">
                <span>No results found</span>
            </div>
        }

    </div>
</div>
